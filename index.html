<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUST QR</title>
<meta name="description" content="A minimal QR code generator that runs entirely in your browser. No ads, no login, no analytics.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; base-uri 'none'; form-action 'none'">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<script type="module" src="app.js"></script>
</head>
<body>

<div class="container">
  <div class="brand">
    <h1>JUST QR</h1>
    <span>no ads. no login.</span>
  </div>

  <div class="input-group">
    <input type="text" id="urlInput" placeholder="paste your URL here" aria-label="URL to encode" aria-describedby="urlError" aria-invalid="false" inputmode="url" spellcheck="false" autocomplete="off">
    <button id="generate" type="button">Generate</button>
  </div>
  <p id="urlError" class="input-error" role="alert" hidden></p>
  <div class="options">
    <label for="level">Error correction</label>
    <select id="level">
      <option value="L">L · recovers about 7%</option>
      <option value="M">M · recovers about 15%</option>
      <option value="Q">Q · recovers about 25%</option>
      <option value="H" selected>H · recovers about 30%</option>
    </select>
  </div>

  <div class="output-area" id="outputArea" inert>
    <div class="qr-frame">
      <div id="qrCode"></div>
    </div>
    <div class="url-preview" id="urlPreview"></div>
    <div class="actions">
      <button class="btn-download" id="download" type="button">Download PNG</button>
      <button class="btn-copy" id="copy" type="button">Copy to Clipboard</button>
      <button class="btn-reset" id="clear" type="button">Clear</button>
    </div>
  </div>

  <div class="footer">PASTE. GENERATE. DONE.<br><span class="credit">generated by Charles Dai</span></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>


</body>
</html>
